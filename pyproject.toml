[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundcheck"
version = "0.1.0"
description = "Claim-level hallucination verification for RAG over SEC 10-K filings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Runtime dependencies are added module by module as they are built,
# so every entry here is something the code actually imports.
dependencies = [
    "beautifulsoup4>=4.12",
    "faiss-cpu>=1.8",
    "lxml>=5.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# The real embedding model (BAAI/bge-small-en-v1.5). Pulls in PyTorch, so it is not
# installed in CI: tests use the hashing fake embedder instead.
embed = [
    "sentence-transformers>=3.0",
]
# A local Hugging Face model for candidate generation on a Colab GPU (HFLocalProvider).
hf = [
    "accelerate>=0.30",
    "torch>=2.2",
    "transformers>=4.43",
]

# Open verifier models (MiniCheck, HHEM) and the fine-tuned verifier, run locally on CPU
# or Apple MPS. Never installed in CI: tests use stand-in torch/transformers modules.
# sentencepiece/protobuf: the DeBERTa-v3 and Flan-T5 tokenizers need them.
verifiers = [
    "protobuf>=4.25",
    "sentencepiece>=0.2",
    "torch>=2.2",
    "transformers>=4.43",
]

# Fine-tuning the small verifier (scripts/train_verifier.py, best on a Colab GPU).
train = [
    "accelerate>=0.26",
    "protobuf>=4.25",
    "sentencepiece>=0.2",
    "torch>=2.2",
    "transformers>=4.43",
]

[project.scripts]
groundcheck = "groundcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, UP: modern syntax,
# B: common bug patterns, SIM: simplifications.
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
