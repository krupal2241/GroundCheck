name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Only the dev extra: tests use fake embedders/LLMs and never download
      # models or contact SEC, so CI stays fast and offline-safe.
      - run: pip install -e ".[dev]"
      # Coverage is reported, never enforced: no --cov-fail-under, so it can't fail the build.
      - run: pytest -q --cov=groundcheck --cov-report=term
      - name: Coverage percentage
        if: always()
        continue-on-error: true
        run: |
          total=$(coverage report --format=total)
          echo "Coverage (Python ${{ matrix.python-version }}): ${total}%"
          echo "Coverage (Python ${{ matrix.python-version }}): ${total}%" >> "$GITHUB_STEP_SUMMARY"
