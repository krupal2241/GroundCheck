# Companies and the exact 10-K filing used for each.
#
# How to pin a filing (on your own machine; needs network access to sec.gov):
#   1. groundcheck resolve-filings
#   2. Check that the "SEC name" it prints matches the company you meant.
#   3. Paste the printed accession / primary_document / filing_date / fiscal_year_end
#      values below.
# period is the period of report (the actual fiscal year-end date of the 10-K), added
# by hand because SEC's fiscal_year_end is only approximate (e.g. JNJ reports "0103"
# for a year ending 2025-12-28).
# `groundcheck download` refuses to run until every company is pinned.
#
# CIKs were entered by hand; resolve-filings prints the name SEC has on file for each
# CIK so a wrong one is caught before anything is downloaded.
#
# role:
#   labeled      questions for the hand-labeled test set come from this company
#   unlabeled    parsed and indexed, not used for the labeled set
#   stress_test  parser stress test only

