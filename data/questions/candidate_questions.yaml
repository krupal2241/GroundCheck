# Candidate-generation questions.
#
# Every labeled company has ten typed slots (the PLAN.md mix: 2 numeric_lookup,
# 2 table, 2 multi_step, 1 yes_no, 2 temporal, 1 unanswerable). Five slots per company
# are filled here; the other five types come from data/eval/retrieval_questions.yaml
# (one numeric_lookup, table, multi_step, yes_no and temporal question per company),
# which scripts/generate_candidates.py also uses. Together that is 60 questions,
# 10 per company, in the PLAN.md mix. Empty slots (`question: ""`) are skipped.
#
# The questions were drafted by Claude at the project owner's request using only the
# text in data/chunks/<TICKER>.jsonl. Each note gives the expected answer and the
# filing text it comes from; for unanswerable questions it says what was searched.
#
# qtype is one of: numeric_lookup, table, multi_step, yes_no, temporal, unanswerable
#   numeric_lookup  "What was total net sales in fiscal 2025?"
#   table           a value that only appears in a financial table
#   multi_step      a difference, ratio or growth rate between two reported values
#   yes_no          "Did the company repurchase shares during the year?"
#   temporal        across years or periods, or fiscal vs calendar year
#   unanswerable    a plausible question the filing does not answer

