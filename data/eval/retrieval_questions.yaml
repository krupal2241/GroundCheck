# Retrieval evaluation questions (template). Fill these in yourself.
#
# Ground rule: gold evidence is written by a human. Claude may suggest question
# wording, but every gold_evidence string must be copied by you from the parsed text.
#
# How to fill in an entry:
#   1. Open data/parsed/<TICKER>.txt (made by `groundcheck parse`).
#   2. Write the question.
#   3. Copy the exact text that answers it into gold_evidence. Keep each string short
#      (a phrase or one table row, well under 50 words) so it can't straddle two chunks.
#      Matching is exact after collapsing whitespace, so copy; don't retype.
#      Table rows look like: Total net sales | $416,161 | $391,035
#   4. multi_step questions: one gold string per value used (recall gives partial credit).
#   5. gold_items is optional: the Item section(s) the answer should come from, e.g.
#      ["7"] or ["8"]. If left empty, it is inferred from where the gold strings occur.
#   6. Run `groundcheck eval-retrieval --check` (no model needed) to catch typos.
#
# Entries with an empty question or empty gold_evidence are skipped as "unfilled".
# qtype is one of: numeric_lookup, table, multi_step, yes_no, temporal, unanswerable
# (unanswerable questions have no gold and are skipped by retrieval eval).
#
# Example of a filled entry (made-up text, not from a real filing):
#   - id: EXCO-01
#     ticker: EXCO
#     qtype: table
#     question: "What were Example Corp's total net sales in 2025?"
#     gold_evidence:
#       - "Total net sales | $12,345 | $11,000"
#     gold_items: ["7"]
#     notes: "Also in Item 8; MD&A table is the expected hit."

